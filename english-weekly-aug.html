<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>August 2026 Current Affairs (Week 1) - 3D Analytics Portal</title>
    <!-- Highcharts 3D Engine -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-3d.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --correct-color: #10b981;
            --wrong-color: #ef4444;
            --unatt-color: #f59e0b;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
        }

        .glass-header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .glass-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: center;
        }

        #chart3DContainer {
            width: 100%;
            height: 280px;
        }

        .stats-box {
            text-align: left;
            padding-left: 10px;
        }

        .stat-line {
            font-size: 16px;
            margin: 10px 0;
            font-weight: 600;
        }

        .q-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .q-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .q-text {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.2s;
            user-select: none;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .option input {
            margin-right: 12px;
            accent-color: var(--accent);
            transform: scale(1.1);
            pointer-events: none;
        }

        .exp-box {
            display: none;
            margin-top: 15px;
            padding: 14px;
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid #f59e0b;
            font-size: 13.5px;
            color: #cbd5e1;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 10px;
        }

        .btn-action:hover {
            background: linear-gradient(90deg, #4f46e5 0%, #4338ca 100%);
        }

        .option.correct-choice { 
            background: rgba(16, 185, 129, 0.18) !important; 
            border-color: var(--correct-color) !important; 
            color: #a7f3d0; 
            font-weight: 600; 
        }
        
        .option.wrong-choice { 
            background: rgba(239, 68, 68, 0.18) !important; 
            border-color: var(--wrong-color) !important; 
            color: #fca5a5; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 650px) {
            .analytics-grid { grid-template-columns: 1fr; text-align: center; }
            .stats-box { padding-left: 0; margin-top: 15px; }
        }
    </style>
</head>
<body>

<div class="container">

            <div class="stats-box">

                <div class="stat-line" style="color: var(--correct-color);">Correct Answers (+1): <span id="correctCount"></span></div>
                <div class="stat-line" style="color: var(--wrong-color);">Wrong Answers (-0.25): <span id="wrongCount"></span></div>
                <div class="stat-line" style="color: var(--unatt-color);">Unattempted (0): <span id="unattCount"></span></div>
            </div>
        </div>
    </div>

    <form id="quizForm">
        <div id="questions-pool"></div>
        <button type="button" class="btn-action" onclick="evaluateMetrics()">Submit Test & Calculate Final Score</button>
    </form>
</div>

    ];

    const pool = document.getElementById('questions-pool');

    // Populate questions dynamically
    db.forEach((item, index) => {
        let optHtml = '';
        item.a.forEach((opt) => {
            const letter = opt.substring(0, 1);
            optHtml += `<div class="option" id="label_${index}_${letter}" onclick="toggleOption('${index}', '${letter}')">
                <input type="radio" name="q${index}" value="${letter}" id="q_${index}_${letter}" data-waschecked="false">
                <span class="opt-txt">${opt}</span>
            </div>`;
        });

        pool.innerHTML += `
            <div class="q-card" id="card_${index}">
                <div class="q-text">Q${index + 1}. ${item.q}</div>
                <div class="options-grid">${optHtml}</div>
                <div class="exp-box" id="exp_${index}"><strong>Correct Answer: ${item.c}</strong> — ${item.e}</div>
            </div>
        `;
    });

    // Toggle Selection / Deselect (Uncheck) Handler Logic
    function toggleOption(qIndex, letter) {
        const targetRadio = document.getElementById(`q_${qIndex}_${letter}`);
        if (!targetRadio) return;

        const isAlreadyChecked = targetRadio.dataset.waschecked === "true";

        // Reset all options for this question
        document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(r => {
            r.checked = false;
            r.dataset.waschecked = "false";
        });

        // Toggle logic
        if (!isAlreadyChecked) {
            targetRadio.checked = true;
            targetRadio.dataset.waschecked = "true";
        }
    }

    // Evaluate test with 1/4th (0.25) Negative Marking
    function evaluateMetrics() {
        let correctCount = 0;
        let wrongCount = 0;
        let unattCount = 0;
        let totalQuestions = db.length;

        db.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const exp = document.getElementById(`exp_${index}`);
            
            if (exp) exp.style.display = 'block';

            // Clear previous highlight styles
            item.a.forEach(opt => {
                const letCode = opt.substring(0, 1);
                document.getElementById(`label_${index}_${letCode}`).classList.remove('correct-choice', 'wrong-choice');
            });

            // Highlight Correct Answer
            document.getElementById(`label_${index}_${item.c}`).classList.add('correct-choice');

            if (selected) {
                if (selected.value === item.c) {
                    correctCount++;
                } else {
                    wrongCount++;
                    document.getElementById(`label_${index}_${selected.value}`).classList.add('wrong-choice');
                }
            } else {
                unattCount++;
            }
        });

        // 0.25 Negative Marking formula
        let netScore = (correctCount * 1.0) - (wrongCount * 0.25);
        if (netScore < 0) netScore = 0;
        
        let simulatedPercentile = ((netScore / totalQuestions) * 100).toFixed(1);
        if (netScore === totalQuestions) simulatedPercentile = "100.0";
        else if (netScore === 0) simulatedPercentile = "0.0";
        else simulatedPercentile = (parseFloat(simulatedPercentile) - (Math.random() * 1.1)).toFixed(1);

        // Update Scorecard Dashboard
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('netScoreText').innerText = `Net Score (Negative Applied): ${netScore.toFixed(2)} / ${totalQuestions}`;
        document.getElementById('percentileText').innerText = `Simulated Competitive Rank: ${simulatedPercentile}%`;
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('wrongCount').innerText = wrongCount;
        document.getElementById('unattCount').innerText = unattCount;

        // Render True 3D Donut Chart via Highcharts
        Highcharts.chart('chart3DContainer', {
            chart: {
                type: 'pie',
                backgroundColor: 'transparent',
                options3d: {
                    enabled: true,
                    alpha: 45,
                    beta: 0
                }
            },
            title: { text: '' },
            tooltip: { pointFormat: '{series.name}: <b>{point.y} ({point.percentage:.1f}%)</b>' },
            plotOptions: {
                pie: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    depth: 45,
                    innerSize: 50,
                    dataLabels: {
                        enabled: true,
                        format: '{point.name}: {point.y}',
                        style: { color: '#ffffff', fontSize: '11px' }
                    }
                }
            },
            series: [{
                name: 'Questions',
                data: [
                    { name: 'Correct (+1)', y: correctCount, color: '#10b981', sliced: true, selected: true },
                    { name: 'Wrong (-0.25)', y: wrongCount, color: '#ef4444' },
                    { name: 'Unattempted (0)', y: unattCount, color: '#f59e0b' }
                ]
            }],
            credits: { enabled: false }
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
