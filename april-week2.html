<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>April 2026 CA (Weekly 2) - 3D Grand Analytics Portal</title>
    <!-- Highcharts 3D Engine -->

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --correct-color: #10b981;
            --wrong-color: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
        }

        .glass-header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .glass-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: center;
        }

        #chart3DContainer {
            width: 100%;
            height: 280px;
        }

        .stats-box {
            text-align: left;
            padding-left: 10px;
        }

        .stat-line {
            font-size: 17px;
            margin: 12px 0;
            font-weight: 600;
        }

        .q-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .q-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .q-text {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.2s;
            user-select: none;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .option input {
            margin-right: 12px;
            accent-color: var(--accent);
            transform: scale(1.1);
            pointer-events: none;
        }

        .exp-box {
            display: none;
            margin-top: 15px;
            padding: 14px;
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid #f59e0b;
            font-size: 13.5px;
            color: #cbd5e1;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 10px;
        }

        .btn-action:hover {
            background: linear-gradient(90deg, #4f46e5 0%, #4338ca 100%);
        }

        .option.correct-choice { 
            background: rgba(16, 185, 129, 0.18) !important; 
            border-color: var(--correct-color) !important; 
            color: #a7f3d0; 
            font-weight: 600; 
        }
        
        .option.wrong-choice { 
            background: rgba(239, 68, 68, 0.18) !important; 
            border-color: var(--wrong-color) !important; 
            color: #fca5a5; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 650px) {
            .analytics-grid { grid-template-columns: 1fr; text-align: center; }
            .stats-box { padding-left: 0; margin-top: 15px; }
        }
    </style>
</head>

        { q: "India officially withdrew its proposal to host which UN Climate Summit in 2028?", a: ["A) COP 29", "B) COP 30", "C) COP 33", "D) COP 35"], c: "C", e: "Withdrew proposal to host COP 33 in 2028 (originally offered at COP 28 Dubai); South Korea is now sole applicant." },

        { q: "According to NITI Aayog's 2nd credit report, Indian women borrowers hold a total credit portfolio of:", a: ["A) Rs 25 lakh Cr", "B) Rs 45 lakh Cr", "C) Rs 76 lakh Cr", "D) Rs 100 lakh Cr"], c: "C", e: "Hold Rs 76 lakh Cr (26% of total system credit). Women business credit grew at 31% CAGR (2022-25)." },

        { q: "According to IRENA Renewable Energy Statistics 2026, renewable sources met what record share of India's power demand in July 2025?", a: ["A) 33.3%", "B) 42.5%", "C) 51.5%", "D) 60.0%"], c: "C", e: "Met record 51.5% of demand in July 2025. India achieved 50% non-fossil capacity 5 years ahead of Paris target." },
        { q: "The Delimitation Bill cleared alongside Nari Shakti Vandan Adhiniyam proposes to increase Lok Sabha seats from 543 to:", a: ["A) 600", "B) 750", "C) 816", "D) 900"], c: "C", e: "Proposes 50% seat increase (543 to 816 in Lok Sabha, reserving 273 for women from 2029 elections)." },

        { q: "NITI Aayog released 2 reports on the R&D ecosystem after consulting 400+ leaders and 850+ scientists titled:", a: ["A) R&D Vision 2030", "B) Ease of Doing Research & Development in India", "C) National Innovation Index", "D) ANRF R&D Matrix"], c: "B", e: "Released 'Ease of Doing R&D in India' and its companion Survey Report based on 9 months of outreach." },

        { q: "Dredging Corporation of India (DCIL) signed a strategic alliance MoU for shipbuilding & repairs with:", a: ["A) Mazagon Dock", "B) Colombo Dockyard PLC, Sri Lanka", "C) Cochin Shipyard", "D) Sembcorp Marine"], c: "B", e: "Signed with Colombo Dockyard PLC in Colombo to explore specialized dredger construction." },

        { q: "NTPC signed a non-binding MoU with Électricité de France (EDF) to explore nuclear power projects based on:", a: ["A) VVER Tech", "B) EDF's EPR Technology", "C) PHWR Tech", "D) Small Modular Reactors"], c: "B", e: "Jointly assessing applicability of EDF's EPR nuclear technology for Indian conditions." },
        { q: "Doordarshan (Prasar Bharati) signed a 3-year cultural diplomacy MoU with which council?", a: ["A) ICCR", "B) Sahitya Akademi", "C) Sangeet Natak Akademi", "D) ICHR"], c: "A", e: "Signed with Indian Council for Cultural Relations (ICCR) with joint ownership of content rights in perpetuity." },
        { q: "Ministry of Labour & Employment signed MoUs with Porter and Gigin Tech to expand job matching via which portal?", a: ["A) e-Shram", "B) National Career Service (NCS) Portal", "C) Skill India Digital", "D) My Bharat"], c: "B", e: "Porter aims 6 lakh logistics jobs/yr and Gigin 2-3 lakh jobs/yr via NCS portal (launched in 2015)." },
        { q: "Deakin University of Australia partnered with Telangana's innovation hub Aikam to set up which applied AI hub?", a: ["A) Aikam-AI Center", "B) Aikam-DHRITI Hub", "C) Telangana AI Labs", "D) Deakin Tech Park"], c: "B", e: "Setting up joint applied AI research center 'Aikam-DHRITI' across education, research & industry." },
        { q: "Vietnam's Vingroup signed an MoU with Maharashtra government for strategic investments worth:", a: ["A) $2.5 Billion", "B) $5.0 Billion", "C) $6.5 Billion", "D) $10.0 Billion"], c: "C", e: "$6.5B investment covering 1,000-hectare urban township ($5B) and 60,000 electric taxis ($1.5B)." },
        { q: "India signed an MoU for a Small Development Project to construct a school in Myanmar's capital:", a: ["A) Yangon", "B) Mandalay", "C) Nay Pyi Taw", "D) Bago"], c: "C", e: "Signed during MoS Kirti Vardhan Singh's visit for school construction in Nay Pyi Taw." },
        { q: "Gujarat government signed an MoU with Allegiance International (Taiwan) to build an Industrial Park in:", a: ["A) Dholera-Dharampur", "B) Sanand-Dholera region", "C) GIFT City", "D) Vadodara"], c: "B", e: "Developing Indo-Taiwan Industrial Park in Sanand-Dholera expecting Rs 1,000 Cr+ FDI in semiconductors." }
    ];

    const pool = document.getElementById('questions-pool');

    // Render questions
    db.forEach((item, index) => {
        let optHtml = '';
        item.a.forEach((opt) => {
            const letter = opt.substring(0, 1);
            optHtml += `<div class="option" id="label_${index}_${letter}" onclick="toggleOption('${index}', '${letter}')">
                <input type="radio" name="q${index}" value="${letter}" id="q_${index}_${letter}" data-waschecked="false">
                <span class="opt-txt">${opt}</span>
            </div>`;
        });

        pool.innerHTML += `
            <div class="q-card" id="card_${index}">
                <div class="q-text">Q${index + 1}. ${item.q}</div>
                <div class="options-grid">${optHtml}</div>
                <div class="exp-box" id="exp_${index}"><strong>Correct Answer: ${item.c}</strong> — ${item.e}</div>
            </div>
        `;
    });

    // Toggle Selection / Deselect Handler Logic
    function toggleOption(qIndex, letter) {
        const targetRadio = document.getElementById(`q_${qIndex}_${letter}`);
        if (!targetRadio) return;

        const isAlreadyChecked = targetRadio.dataset.waschecked === "true";

        // Reset state for all radio inputs of this question
        document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(r => {
            r.checked = false;
            r.dataset.waschecked = "false";
        });

        // Toggle logic: If it was NOT checked previously, set it to checked
        if (!isAlreadyChecked) {
            targetRadio.checked = true;
            targetRadio.dataset.waschecked = "true";
        }
    }

    function evaluateMetrics() {
        let correctCount = 0;
        let totalQuestions = db.length;

        db.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const exp = document.getElementById(`exp_${index}`);
            
            if (exp) exp.style.display = 'block';

            // Clear previous choice highlights
            item.a.forEach(opt => {
                const letCode = opt.substring(0, 1);
                document.getElementById(`label_${index}_${letCode}`).classList.remove('correct-choice', 'wrong-choice');
            });

            // Highlight Correct Answer inside card
            document.getElementById(`label_${index}_${item.c}`).classList.add('correct-choice');

            if (selected) {
                if (selected.value === item.c) {
                    correctCount++;
                } else {
                    document.getElementById(`label_${index}_${selected.value}`).classList.add('wrong-choice');
                }
            }
        });

        let wrongCount = totalQuestions - correctCount;
        let simulatedPercentile = ((correctCount / totalQuestions) * 100).toFixed(1);
        if (correctCount === totalQuestions) simulatedPercentile = "100.0";
        else if (correctCount === 0) simulatedPercentile = "0.0";
        else simulatedPercentile = (parseFloat(simulatedPercentile) - (Math.random() * 1.5)).toFixed(1);

        // Update Dashboard Stats
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('scoreText').innerText = `Absolute Score: ${correctCount} / ${totalQuestions}`;
        document.getElementById('percentileText').innerText = `Simulated Competitive Rank: ${simulatedPercentile}%`;
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('wrongCount').innerText = wrongCount;

        // Render True 3D Donut/Pie Chart via Highcharts
        Highcharts.chart('chart3DContainer', {
            chart: {
                type: 'pie',
                backgroundColor: 'transparent',
                options3d: {
                    enabled: true,
                    alpha: 45,
                    beta: 0
                }
            },
            title: { text: '' },
            accessibility: { point: { valueSuffix: '%' } },
            tooltip: { pointFormat: '{series.name}: <b>{point.y} ({point.percentage:.1f}%)</b>' },
            plotOptions: {
                pie: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    depth: 45,
                    innerSize: 50,
                    dataLabels: {
                        enabled: true,
                        format: '{point.name}: {point.y}',
                        style: { color: '#ffffff', fontSize: '12px' }
                    }
                }
            },
            series: [{
                name: 'Questions',
                data: [
                    { name: 'Correct', y: correctCount, color: '#10b981', sliced: true, selected: true },
                    { name: 'Wrong/Unattempted', y: wrongCount, color: '#ef4444' }
                ]
            }],
            credits: { enabled: false }
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
