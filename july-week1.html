<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>July 2026 Current Affairs - 3D Grand Analytics Portal</title>
    <!-- Highcharts 3D Engine -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-3d.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --correct-color: #10b981;
            --wrong-color: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
        }

        .glass-header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .glass-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: center;
        }

        #chart3DContainer {
            width: 100%;
            height: 280px;
        }

        .stats-box {
            text-align: left;
            padding-left: 10px;
        }

        .stat-line {
            font-size: 17px;
            margin: 12px 0;
            font-weight: 600;
        }

        .q-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .q-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .q-text {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.2s;
            user-select: none;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .option input {
            margin-right: 12px;
            accent-color: var(--accent);
            transform: scale(1.1);
            pointer-events: none;
        }

        .exp-box {
            display: none;
            margin-top: 15px;
            padding: 14px;
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid #f59e0b;
            font-size: 13.5px;
            color: #cbd5e1;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 10px;
        }

        .btn-action:hover {
            background: linear-gradient(90deg, #4f46e5 0%, #4338ca 100%);
        }

        .option.correct-choice { 
            background: rgba(16, 185, 129, 0.18) !important; 
            border-color: var(--correct-color) !important; 
            color: #a7f3d0; 
            font-weight: 600; 
        }
        
        .option.wrong-choice { 
            background: rgba(239, 68, 68, 0.18) !important; 
            border-color: var(--wrong-color) !important; 
            color: #fca5a5; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 650px) {
            .analytics-grid { grid-template-columns: 1fr; text-align: center; }
            .stats-box { padding-left: 0; margin-top: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-header">
        <h1>July 2026 Current Affairs Pro Engine</h1>
        <p style="margin: 8px 0 0 0; font-size: 13.5px; color: var(--text-muted);">
            Complete 95 Topics 3D Interactive Portal with Toggle-Deselect Feature
        </p>
    </div>

    <!-- Analytics Dashboard with True 3D Chart -->

        <div class="analytics-grid">
            <div id="chart3DContainer"></div>
            <div class="stats-box">
                <div class="stat-line" id="scoreText" style="color: #6366f1;"></div>
                <div class="stat-line" id="percentileText" style="color: #a855f7;"></div>
                <div class="stat-line" style="color: var(--correct-color);">Correct Answers: <span id="correctCount"></span></div>
                <div class="stat-line" style="color: var(--wrong-color);">Wrong/Unattempted: <span id="wrongCount"></span></div>
            </div>
        </div>
    </div>

    <form id="quizForm">
        <div id="questions-pool"></div>
        <button type="button" class="btn-action" onclick="evaluateMetrics()">Submit Test & Render 3D Chart</button>
    </form>
</div>

        { q: "ICMR-MINDS won the Gold Award for e-Governance 2026. What does ICMR-MINDS integrate with eSanjeevani?", a: ["A) Cancer Screening", "B) Mental and Substance Use Disorders screening", "C) Diabetes Tracker", "D) Maternal Care AI"], c: "B", e: "Integrates mental & substance use disorder screening with NCDs via AI decision support on eSanjeevani." },

        { q: "Under PMKSY, 'Per Drop More Crop (PDMC)' offers what percentage financial assistance to small & marginal farmers?", a: ["A) 45%", "B) 55%", "C) 60%", "D) 75%"], c: "B", e: "Offers 55% aid to small/marginal farmers and 45% to others. PMKSY completed over 10 years." },
        { q: "The 'VB-G-RAM-G' Act replacing MGNREGA provides a statutory guarantee of how many days wage employment per year?", a: ["A) 100 Days", "B) 125 Days", "C) 150 Days", "D) 180 Days"], c: "B", e: "Guarantees 125 days wage employment per year with total budget of Rs 1,51,282 crore. Minimum wage >= Rs 300/day." },

        { q: "ADB approved $182.89 million loan for 'Strengthening Karnataka Public Schools Program' to establish how many integrated clusters?", a: ["A) 250 Clusters", "B) 500 Clusters", "C) 1,000 Clusters", "D) 100 Clusters"], c: "B", e: "Supports 500 integrated school clusters from pre-primary to secondary, complemented by IFFEd grant/guarantee." },
        { q: "Chennai became the first Indian city to adopt a closed-loop water ring-main approach supported by a ADB loan of:", a: ["A) $150 Million", "B) $230 Million", "C) $300 Million", "D) $500 Million"], c: "B", e: "$230M loan under CCRWSSP to construct 170+ km pipelines and 91.2 km water ring main." },

        { q: "The 'Yamuna Water Project' MoA signed between Haryana and Rajasthan involves an estimated cost of:", a: ["A) Rs 15,000 Cr", "B) Rs 24,000 Cr", "C) Rs 34,102 Cr", "D) Rs 50,000 Cr"], c: "C", e: "Rs 34,102 Cr project conveying ~580 MCM water via 3 underground pipelines to Shekhawati & Haryana districts." },
        { q: "India and Saudi Arabia signed an MoU on Cooperation in Water Resources during which conference hosted in Jeddah?", a: ["A) World Water Forum", "B) Saudi Water Week", "C) Gulf Hydro Summit", "D) Red Sea Conference"], c: "B", e: "Signed at 1st Saudi Water Week in Jeddah. Saudi Arabia provides ~16% of India's crude oil imports." },
        { q: "Ministry of Tourism signed an MoU with Google India structured around Travel Trend Insights, Digital Discovery, and:", a: ["A) Hotel Monetization", "B) Capacity Building", "C) Visa Automation", "D) Airline Ticketing"], c: "B", e: "Structured around 3 pillars: Travel Trend Insights, Digital Discovery, and Capacity Building for officials." },
        { q: "Air India signed an MoU to develop a global aviation MRO hub with SIAEC based in which country?", a: ["A) France", "B) Singapore", "C) Germany", "D) UAE"], c: "B", e: "Partnered with SIA Engineering Company (SIAEC) Singapore to build world-class MRO ecosystem." },
        { q: "Agnikul Cosmos partnered with ICEYE (Finland) to manufacture and launch which satellite systems from India?", a: ["A) Optical Hyperspectral", "B) Synthetic Aperture Radar (SAR)", "C) Infrared Thermal", "D) LEO Broadband"], c: "B", e: "MoU signed during BharatInnovates in Nice, France to build & launch SAR satellites using 3D-printed rockets." },
        { q: "Adani Enterprises and Abu Dhabi's IRH signed an MoU with Odisha for an integrated aluminium project worth:", a: ["A) $5 Billion", "B) $11.5 Billion (Rs 1.08 Lakh Cr)", "C) $20 Billion", "D) $15 Billion"], c: "B", e: "50:50 JV setting up 4 MMTPA alumina refinery in Rayagada, 2 MMTPA smelter in Sundargarh & 4000 MW power plant." },
        { q: "Under the Bilateral Investment Agreement (BIA) between India & Israel, the local remedies exhaustion period was reduced to:", a: ["A) 1 Year", "B) 3 Years", "C) 5 Years", "D) 7 Years"], c: "B", e: "Reduced from 5 years to 3 years. Israel is the 1st OECD country with which India signed such an agreement." }
    ];

    const pool = document.getElementById('questions-pool');

    // Render questions
    db.forEach((item, index) => {
        let optHtml = '';
        item.a.forEach((opt) => {
            const letter = opt.substring(0, 1);
            optHtml += `<div class="option" id="label_${index}_${letter}" onclick="toggleOption('${index}', '${letter}')">
                <input type="radio" name="q${index}" value="${letter}" id="q_${index}_${letter}" data-waschecked="false">
                <span class="opt-txt">${opt}</span>
            </div>`;
        });

        pool.innerHTML += `
            <div class="q-card" id="card_${index}">
                <div class="q-text">Q${index + 1}. ${item.q}</div>
                <div class="options-grid">${optHtml}</div>
                <div class="exp-box" id="exp_${index}"><strong>Correct Answer: ${item.c}</strong> — ${item.e}</div>
            </div>
        `;
    });

    // Toggle Selection / Deselect Handler Logic
    function toggleOption(qIndex, letter) {
        const targetRadio = document.getElementById(`q_${qIndex}_${letter}`);
        if (!targetRadio) return;

        const isAlreadyChecked = targetRadio.dataset.waschecked === "true";

        // Reset state for all radio inputs of this question
        document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(r => {
            r.checked = false;
            r.dataset.waschecked = "false";
        });

        // Toggle logic: If it was NOT checked previously, set it to checked
        if (!isAlreadyChecked) {
            targetRadio.checked = true;
            targetRadio.dataset.waschecked = "true";
        }
    }

    function evaluateMetrics() {
        let correctCount = 0;
        let totalQuestions = db.length;

        db.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const exp = document.getElementById(`exp_${index}`);
            
            if (exp) exp.style.display = 'block';

            // Clear previous choice highlights
            item.a.forEach(opt => {
                const letCode = opt.substring(0, 1);
                document.getElementById(`label_${index}_${letCode}`).classList.remove('correct-choice', 'wrong-choice');
            });

            // Highlight Correct Answer inside card
            document.getElementById(`label_${index}_${item.c}`).classList.add('correct-choice');

            if (selected) {
                if (selected.value === item.c) {
                    correctCount++;
                } else {
                    document.getElementById(`label_${index}_${selected.value}`).classList.add('wrong-choice');
                }
            }
        });

        let wrongCount = totalQuestions - correctCount;
        let simulatedPercentile = ((correctCount / totalQuestions) * 100).toFixed(1);
        if (correctCount === totalQuestions) simulatedPercentile = "100.0";
        else if (correctCount === 0) simulatedPercentile = "0.0";
        else simulatedPercentile = (parseFloat(simulatedPercentile) - (Math.random() * 1.5)).toFixed(1);

        // Update Dashboard Stats
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('scoreText').innerText = `Absolute Score: ${correctCount} / ${totalQuestions}`;
        document.getElementById('percentileText').innerText = `Simulated Competitive Rank: ${simulatedPercentile}%`;
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('wrongCount').innerText = wrongCount;

        // Render True 3D Donut/Pie Chart via Highcharts
        Highcharts.chart('chart3DContainer', {
            chart: {
                type: 'pie',
                backgroundColor: 'transparent',
                options3d: {
                    enabled: true,
                    alpha: 45,
                    beta: 0
                }
            },
            title: { text: '' },
            accessibility: { point: { valueSuffix: '%' } },
            tooltip: { pointFormat: '{series.name}: <b>{point.y} ({point.percentage:.1f}%)</b>' },
            plotOptions: {
                pie: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    depth: 45,
                    innerSize: 50,
                    dataLabels: {
                        enabled: true,
                        format: '{point.name}: {point.y}',
                        style: { color: '#ffffff', fontSize: '12px' }
                    }
                }
            },
            series: [{
                name: 'Questions',
                data: [
                    { name: 'Correct', y: correctCount, color: '#10b981', sliced: true, selected: true },
                    { name: 'Wrong/Unattempted', y: wrongCount, color: '#ef4444' }
                ]
            }],
            credits: { enabled: false }
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
