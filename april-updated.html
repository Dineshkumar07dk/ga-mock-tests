<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>April 2026 CA - Advanced Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --correct-color: #10b981;
            --wrong-color: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .glass-header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
        }

        .glass-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard {
            display: none;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
            margin-top: 20px;
        }

        .chart-box {
            max-width: 250px;
            margin: 0 auto;
        }

        .stats-box {
            text-align: left;
            padding-left: 20px;
        }

        .stat-line {
            font-size: 18px;
            margin: 12px 0;
            font-weight: 500;
        }

        .q-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .q-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .q-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14.5px;
            transition: all 0.2s;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .option input {
            margin-right: 12px;
            accent-color: var(--accent);
            transform: scale(1.1);
        }

        .exp-box {
            display: none;
            margin-top: 15px;
            padding: 14px;
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid #f59e0b;
            font-size: 14px;
            color: #cbd5e1;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            margin-top: 10px;
        }

        .btn-action:hover {
            background: linear-gradient(90deg, #4f46e5 0%, #4338ca 100%);
        }

        .option.correct-choice { background: rgba(16, 185, 129, 0.15) !important; border-color: var(--correct-color) !important; color: #a7f3d0; font-weight: 600; }
        .option.wrong-choice { background: rgba(239, 68, 68, 0.15) !important; border-color: var(--wrong-color) !important; color: #fca5a5; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .analytics-grid { grid-template-columns: 1fr; text-align: center; }
            .stats-box { padding-left: 0; margin-top: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-header">
        <h1>April 2026 Current Affairs Pro Engine</h1>
        <p style="margin: 8px 0 0 0; font-size: 14px; color: var(--text-muted);">Comprehensive 91 Topics Advanced Analytics Testing Arena</p>

            <div class="chart-box">
                <canvas id="metricsChart"></canvas>
            </div>
            <div class="stats-box">
                <div class="stat-line" id="scoreText" style="color: #6366f1;"></div>

                <div class="stat-line" style="color: var(--correct-color);">Correct Answers: <span id="correctCount"></span></div>
                <div class="stat-line" style="color: var(--wrong-color);">Wrong/Unattempted: <span id="wrongCount"></span></div>
            </div>
        </div>
    </div>

    <form id="quizForm">
        <div id="questions-pool"></div>
        <button type="button" class="btn-action" onclick="evaluateMetrics()">Submit Sheet & Compile Data</button>
    </form>
</div>

        { q: "The Natural Gas Futures derivative contracts launched by the NSE are benchmarked to which IGX market pricing index?", a: ["A) NATGAS Spot Index", "B) GIXI Index", "C) IGX Future Yield", "D) Nifty Gas Curve"], c: "B", e: "The financial derivative contracts are linked directly to the GIXI (Gas Index of India) benchmark index." },
        { q: "The Plan of Implementation signed by the Ministry of Shipping to boost native workforce mapping was executed with:", a: ["A) JICA Japan", "B) KOICA South Korea", "C) Singapore Maritime", "D) ADB Infrastructure Division"], c: "B", e: "Executed with the Korea International Cooperation Agency (KOICA) under the Maritime Amrit Kaal Vision 2047." }
    ];

    const pool = document.getElementById('questions-pool');
    let chartInstance = null;

    db.forEach((item, index) => {
        let optHtml = '';
        item.a.forEach((opt) => {
            const letter = opt.substring(0, 1);
            optHtml += `<div class="option" id="label_${index}_${letter}" onclick="selectRadio('${index}', '${letter}')">
                <input type="radio" name="q${index}" value="${letter}" id="q_${index}_${letter}" onclick="event.stopPropagation();">
                <span class="opt-txt">${opt}</span>
            </div>`;
        });

        pool.innerHTML += `
            <div class="q-card" id="card_${index}">
                <div class="q-text">Q${index + 1}. ${item.q}</div>
                <div class="options-grid">${optHtml}</div>
                <div class="exp-box" id="exp_${index}"><strong>Exploration Insight:</strong> ${item.e}</div>
            </div>
        `;
    });

    function selectRadio(qIndex, letter) {
        const targetRadio = document.getElementById(`q_${qIndex}_${letter}`);
        if(targetRadio) {
            targetRadio.checked = true;
        }
    }

    function evaluateMetrics() {
        let correctCount = 0;
        let totalQuestions = db.length;

        db.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const exp = document.getElementById(`exp_${index}`);
            
            if (exp) exp.style.display = 'block';

            item.a.forEach(opt => {
                const letCode = opt.substring(0, 1);
                document.getElementById(`label_${index}_${letCode}`).classList.remove('correct-choice', 'wrong-choice');
            });

            document.getElementById(`label_${index}_${item.c}`).classList.add('correct-choice');

            if (selected) {
                if (selected.value === item.c) {
                    correctCount++;
                } else {
                    document.getElementById(`label_${index}_${selected.value}`).classList.add('wrong-choice');
                }
            }
        });

        let wrongCount = totalQuestions - correctCount;
        let simulatedPercentile = ((correctCount / totalQuestions) * 100).toFixed(1);
        if (correctCount === totalQuestions) simulatedPercentile = "100.0";
        else if (correctCount === 0) simulatedPercentile = "0.0";
        else simulatedPercentile = (parseFloat(simulatedPercentile) - (Math.random() * 2)).toFixed(1);

        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('scoreText').innerText = `Absolute Score: ${correctCount} / ${totalQuestions}`;
        document.getElementById('percentileText').innerText = `Simulated Competitive Percentile: ${simulatedPercentile}%`;
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('wrongCount').innerText = wrongCount;

        const ctx = document.getElementById('metricsChart').getContext('2d');
        if (chartInstance) {
            chartInstance.destroy();
        }
        
        chartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Correct', 'Wrong/Unattempted'],
                datasets: [{
                    data: [correctCount, wrongCount],
                    backgroundColor: ['#10b981', '#ef4444'],
                    borderWidth: 1,
                    borderColor: 'rgba(255,255,255,0.1)'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                }
            }
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
